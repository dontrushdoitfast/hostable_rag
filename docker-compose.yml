version: '3.8'

services:
  retrieval-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CONNECTOR_MODE=dummy
      - API_KEY=default-secret-api-key
      - LOCAL_DATA_DIR=./data/sharepoint_mock
      - SYNC_INTERVAL_SECONDS=3600
      - AUTO_SYNC_ENABLED=true
      - R2R_BASE_URL=http://r2r:7272
    volumes:
      - ./data:/app/data
    restart: unless-stopped
